<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>키움증권 실시간 조건검색 및 시세 모니터링</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 20px;
        background: #f4f7f6;
      }
      h2 {
        color: #333;
      }
      .config-box {
        background: white;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .config-box input {
        padding: 6px;
        margin-right: 10px;
        width: 250px;
      }
      .config-box button {
        padding: 6px 15px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .config-box button:hover {
        background: #0056b3;
      }

      .container {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .row-group {
        display: flex;
        gap: 20px;
      }
      .panel {
        flex: 1;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: center;
        font-size: 13px;
      }
      th {
        background-color: #007bff;
        color: white;
      }

      .log-box {
        background: #1e1e1e;
        color: #00ff00;
        padding: 15px;
        border-radius: 5px;
        height: 200px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 12px;
      }
      .tag-i {
        color: #28a745;
        font-weight: bold;
      }
      .tag-d {
        color: #dc3545;
        font-weight: bold;
      }
      .price-up {
        color: #dc3545;
        font-weight: bold;
      } /* 상승 (빨간색) */
      .price-down {
        color: #28a745;
        font-weight: bold;
      } /* 하락 (파란색) */
    </style>
  </head>
  <body>
    <h2>📈 키움증권 실시간 조건검색 및 체결(0A) 모니터링</h2>

    <!-- 설정 입력 패널 -->
    <div class="config-box">
      <label
        >AppKey:
        <input
          type="text"
          id="appkey"
          value="HW3dPr6BAP0Kh6prpIRHXBposlxy9YH2Wt2zedhY3Zk"
      /></label>
      <label
        >SecretKey:
        <input
          type="text"
          id="secretkey"
          value="J3L6jNLuKViIARgiUXwhdmOY8fR5ILMgpkEqYL-ndVw"
      /></label>
      <button onclick="startMonitoring()">연동 시작</button>
    </div>

    <div class="container">
      <!-- 상단: 조건검색 포착 현황 & 실시간 시세 모니터링 -->
      <div class="row-group">
        <!-- 조건검색 감지 내역 -->
        <div class="panel" style="flex: 1">
          <h3>조건검색 포착 현황</h3>
          <table>
            <thead>
              <tr>
                <th>종목코드</th>
                <th>구분</th>
                <th>시간</th>
              </tr>
            </thead>
            <tbody id="conditionTable"></tbody>
          </table>
        </div>

        <!-- 실시간 시세 (0A) 모니터링 테이블 -->
        <div class="panel" style="flex: 2">
          <h3>실시간 시세 현황 (0A)</h3>
          <table>
            <thead>
              <tr>
                <th>종목코드</th>
                <th>현재가</th>
                <th>전일대비</th>
                <th>등락률</th>
                <th>누적거래량</th>
                <th>시가</th>
                <th>고가</th>
                <th>저가</th>
              </tr>
            </thead>
            <tbody id="stockTable">
              <tr>
                <td colspan="8" style="color: #888">
                  등록된 실시간 시세가 없습니다.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 하단: 시스템 로그 -->
      <div class="panel">
        <h3>실시간 로그</h3>
        <div id="logBox" class="log-box">
          대기 중... 설정 입력 후 '연동 시작'을 누르세요.
        </div>
      </div>
    </div>

    <script>
      const HOST = 'https://mockapi.kiwoom.com';
      const SOCKET_URL = 'wss://mockapi.kiwoom.com:10000/api/websocket';

      const logBox = document.getElementById('logBox');
      const conditionTable = document.getElementById('conditionTable');
      const stockTable = document.getElementById('stockTable');

      // 실시간 시세 데이터를 담아둘 맵 (종목코드를 키로 사용)
      const stockDataMap = new Map();

      function appendLog(text) {
          logBox.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${text}</div>`;
          logBox.scrollTop = logBox.scrollHeight;
      }

      // 1. 접근토큰 발급
      async function getAccessToken(appkey, secretkey) {
          const url = `${HOST}/oauth2/token`;
          const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json;charset=UTF-8' },
              body: JSON.stringify({ 'grant_type': 'client_credentials', 'appkey', 'secretkey' })
          });
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          const data = await response.json();
          return data.access_token || data.token;
      }

      // 2. WebSocket 클라이언트
      class BrowserWebSocketClient {
          constructor(uri, accessToken) {
              this.uri = uri;
              this.accessToken = accessToken;
              this.websocket = null;
              this.connected = false;
              this.registeredStocks = new Set();
          }

          connect() {
              return new Promise((resolve, reject) => {
                  this.websocket = new WebSocket(this.uri);

                  this.websocket.onopen = () => {
                      this.connected = true;
                      appendLog('웹소켓 서버와 연결되었습니다.');
                      this.sendMessage({ trnm: 'LOGIN', token: this.accessToken });
                      resolve();
                  };

                  this.websocket.onerror = (error) => {
                      appendLog(`WebSocket 에러 발생`);
                      reject(error);
                  };

                  this.websocket.onclose = () => {
                      appendLog('WebSocket 연결이 종료되었습니다.');
                      this.connected = false;
                  };

                  this.websocket.onmessage = (event) => {
                      const response = JSON.parse(event.data);

                      if (response.trnm === 'LOGIN') {
                          if (response.return_code !== 0) {
                              appendLog(`로그인 실패: ${response.return_msg}`);
                              this.disconnect();
                          } else {
                              appendLog('웹소켓 로그인 성공하였습니다.');
                              this.requestConditionSearch();
                          }
                      }
                      else if (response.trnm === 'PING') {
                          this.sendMessage(response);
                      }
                      else if (response.trnm === 'REAL') {
                          // 조건검색 실시간 이벤트인지, 0A 실시간 시세인지 분기 처리
                          this.handleRealResponse(response);
                      }
                  };
              });
          }

          requestConditionSearch() {
              appendLog('조건검색 요청 패킷을 전송합니다.');
              this.sendMessage({ 'trnm': 'CNSRREQ', 'seq': '1', 'search_type': '1', 'stex_tp': 'K' });
          }

          handleRealResponse(response) {
              // 키움 실시간 응답 구조(data 리스트) 순회
              const dataList = response.data || [response];

              dataList.forEach(itemObj => {
                  const type = itemObj.type;
                  const stkCd = itemObj.item;
                  const values = itemObj.values;

                  // 1) 조건검색 실시간 데이터 처리 (TR명 혹은 필드 내 구분값이 있는 경우)
                  if (itemObj.name === '조건검색실시간' || values?.['20'] || values?.['843']) {
                      const code = stkCd || values?.['843'];
                      const insDelTp = values?.['20'] || itemObj.ins_del_tp;

                      if (code && insDelTp) {
                          this.processConditionEvent(code, insDelTp);
                      }
                  }

                  // 2) 주식체결 실시간 (0A) 데이터 처리
                  if (type === '0A' && values) {
                      this.processStockTick(stkCd, values);
                  }
              });
          }

          processConditionEvent(stkCd, insDelTp) {
              // 조건검색 테이블에 추가
              if (conditionTable.rows.length === 1 && conditionTable.rows[0].cells.length === 1) {
                  conditionTable.innerHTML = '';
              }
              const row = conditionTable.insertRow(0);
              const typeText = insDelTp === 'I' ? '<span class="tag-i">편입 (I)</span>' : '<span class="tag-d">이탈 (D)</span>';
              row.innerHTML = `<td><b>${stkCd}</b></td><td>${typeText}</td><td>${new Date().toLocaleTimeString()}</td>`;
              appendLog(`[조건검색 감지] 종목: ${stkCd}, 구분: ${insDelTp}`);

              if (insDelTp === 'I' && !this.registeredStocks.has(stkCd)) {
                  this.registeredStocks.add(stkCd);
                  // 0A 실시간 시세 등록 요청
                  this.sendMessage({
                      'trnm': 'REG',
                      'grp_no': '1',
                      'refresh': '0',
                      'data': [{ 'item': [stkCd], 'type': ['0A'] }]
                  });
                  appendLog(`[실시간등록 요청] 종목: ${stkCd} (0A)`);
              } else if (insDelTp === 'D' && this.registeredStocks.has(stkCd)) {
                  this.registeredStocks.delete(stkCd);
                  this.sendMessage({
                      'trnm': 'UNREG',
                      'grp_no': '1',
                      'data': [{ 'item': [stkCd], 'type': ['0A'] }]
                  });
                  appendLog(`[실시간해제 요청] 종목: ${stkCd} (0A)`);
              }
          }

          processStockTick(stkCd, values) {
              // 0A 필드 매핑
              // 10: 현재가, 11: 전일대비, 12: 등락율, 13: 누적거래량, 16: 시가, 17: 고가, 18: 저가
              const tickData = {
                  stkCd: stkCd,
                  currentPrice: values['10'] || '-',
                  priceChange: values['11'] || '-',
                  changeRate: values['12'] || '0.00',
                  volume: values['13'] || '-',
                  open: values['16'] || '-',
                  high: values['17'] || '-',
                  low: values['18'] || '-'
              };

              stockDataMap.set(stkCd, tickData);
              this.renderStockTable();
          }

          renderStockTable() {
              stockTable.innerHTML = '';
              if (stockDataMap.size === 0) {
                  stockTable.innerHTML = `<tr><td colspan="8" style="color: #888;">등록된 실시간 시세가 없습니다.</td></tr>`;
                  return;
              }

              stockDataMap.forEach((data, code) => {
                  const row = stockTable.insertRow();
                  const rateNum = parseFloat(data.changeRate);
                  const colorClass = rateNum > 0 ? 'price-up' : (rateNum < 0 ? 'price-down' : '');

                  row.innerHTML = `
                      <td><b>${code}</b></td>
                      <td>${Number(data.currentPrice).toLocaleString()}원</td>
                      <td class="${colorClass}">${Number(data.priceChange).toLocaleString()}</td>
                      <td class="${colorClass}">${data.changeRate}%</td>
                      <td>${Number(data.volume).toLocaleString()}주</td>
                      <td>${Number(data.open).toLocaleString()}원</td>
                      <td>${Number(data.high).toLocaleString()}원</td>
                      <td>${Number(data.low).toLocaleString()}원</td>
                  `;
              });
          }

          sendMessage(message) {
              if (this.connected && this.websocket) {
                  this.websocket.send(JSON.stringify(message));
              }
          }

          disconnect() {
              if (this.websocket) this.websocket.close();
          }
      }

      async function startMonitoring() {
          const appkey = document.getElementById('appkey').value;
          const secretkey = document.getElementById('secretkey').value;

          if (!appkey || !secretkey) {
              alert('AppKey와 SecretKey를 입력해주세요.');
              return;
          }

          try {
              const accessToken = await getAccessToken(appkey, secretkey);
              const wsClient = new BrowserWebSocketClient(SOCKET_URL, accessToken);
              await wsClient.connect();
          } catch (error) {
              appendLog(`실행 중 오류 발생: ${error.message}`);
          }
      }
    </script>
  </body>
</html>
